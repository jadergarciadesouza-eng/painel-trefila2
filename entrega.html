<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portal Trefila 2 · Pilar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Abas de pilar do Portal Trefila 2 (Segurança · Qualidade · Entrega) — 07/10/2026.
   Mesma família da Visão da área: ardósia + turquesa, Barlow Condensed nos números, IBM Plex Sans no texto.
   - estado nunca só por cor: ícone + palavra; 'sem meta' é um estado próprio (cinza), não é 'bom';
   - dado velho ou ausente aparece como 'sem dado', jamais como zero;
   - o mesmo arquivo gera a versão pública (só agregados da área) e a local (com turma e grade). */
:root{
  color-scheme: light;
  --chrome:#16202b; --chrome-mut:#93a9bd;
  --accent:#2aa3b8; --deep:#0f6d7d; --mid:#7cc0cc; --pale:#cfd8e2;
  --ground:#eef2f6; --surface:#fff; --soft:#f6f8fb;
  --ink:#141b22; --ink2:#3d4c5a; --muted:#566677; --line:#dde4ec; --line2:#c9d3de;
  --plan:#7d8b9a;
  --ok:#1b6e3f;  --ok-bg:#e4f3ea;
  --at:#8a4b00;  --at-bg:#fdf0d6;  --atf:#c27c0e;
  --cr:#a8261b;  --cr-bg:#fce6e3;
  --ne:#4a5866;  --ne-bg:#e9edf2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","IBM Plex Sans",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

/* moldura (só na versão local; dentro do portal a moldura é a do portal) */
.chrome{background:var(--chrome);color:#fff}
.chrome-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px 12px;max-width:1280px;margin:0 auto}
.marca{display:flex;align-items:baseline;gap:12px}
.marca b{font:700 26px/1 var(--cond);letter-spacing:.055em;text-transform:uppercase}
.marca span{font-size:12px;color:var(--chrome-mut)}
.selo{font:500 11px/1.3 var(--sans);color:var(--chrome-mut);text-align:right}
.selo b{display:block;color:#c9d8e5;font-weight:600}
.abas{display:flex;gap:2px;padding:0 22px;max-width:1280px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.aba{border:0;background:transparent;color:var(--chrome-mut);font:600 14px/1 var(--cond);letter-spacing:.07em;text-transform:uppercase;
  padding:13px 16px 11px;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none}
.aba[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent)}
.aba:hover{color:#fff}
body.embed .chrome{display:none}
body.embed main{padding-top:20px}
.ver a{color:var(--deep);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line2);cursor:pointer}
.ver a:hover{border-bottom-color:var(--deep)}
.aviso-local{margin:14px 0 0;padding:10px 14px;background:var(--soft);border:1px dashed var(--line2);border-radius:8px;font-size:13px;color:var(--ink2)}

/* layout */
main{max-width:1280px;margin:0 auto;padding:26px 22px 60px}
.titulo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
h1{margin:0;font:700 34px/1.1 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.legenda{display:flex;flex-wrap:wrap;gap:8px}
h2.sec{margin:34px 0 4px;font:700 22px/1.2 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.sec-sub{margin:0 0 14px;color:var(--muted);font-size:13.5px;max-width:80ch}

/* chip de estado */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);padding:5px 9px 5px 7px;border-radius:999px;white-space:nowrap}
.chip svg{width:13px;height:13px;flex:none}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.at{background:var(--at-bg);color:var(--at)}
.chip.cr{background:var(--cr-bg);color:var(--cr)} .chip.ne{background:var(--ne-bg);color:var(--ne)}

/* cartões de leitura */
.decidir{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.dec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.dec .topo{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.decidir.k3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.dec .pilar{font:600 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--deep)}
.dec h3{margin:0;font:600 17px/1.3 var(--sans)}
.dec p{margin:0;color:var(--ink2);font-size:14px}
.dec .rod{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.kv .v{font:700 40px/1 var(--cond);letter-spacing:.01em}
.kv .v small{font:600 20px var(--cond);color:var(--muted)}
.kv .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.vazio{color:var(--muted);font-size:13px;background:var(--soft);border:1px dashed var(--line2);border-radius:8px;padding:10px 12px}

/* painéis e gráficos */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.duas{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(500px,1fr))}
.tres{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.hal{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.painel h3{margin:0;font:600 17px/1.3 var(--sans)}
.painel .nota{margin:3px 0 8px;font-size:13px;color:var(--muted)}
svg.grafico{width:100%;height:auto;display:block;overflow:visible}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0;font-size:12.5px;color:var(--ink2)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leg b{font-weight:700;margin-right:5px}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--chrome);color:#fff;font-size:12.5px;line-height:1.5;padding:8px 10px;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;max-width:250px}
.tip b{font-weight:600}
details.tab{margin-top:8px;font-size:13px;color:var(--muted)}
details.tab summary{cursor:pointer;width:max-content}
details.tab table{margin-top:8px;border-collapse:collapse;width:100%;font-size:12.5px}
details.tab th,details.tab td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right}
details.tab th:first-child,details.tab td:first-child{text-align:left}
details.tab div{max-height:260px;overflow:auto}

/* barras empilhadas (distribuição da equipe) */
.dist{margin:14px 0 0}
.dist .rot{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:5px}
.dist .rot b{font-weight:600}
.pilha{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.pilha span{display:flex;align-items:center;justify-content:center;font:600 13px var(--cond);min-width:2px}
.pilha .z{background:var(--pale);color:var(--ink)} .pilha .p{background:var(--mid);color:var(--ink)} .pilha .m{background:var(--deep);color:#fff}
.dist .res{font-size:12.5px;color:var(--muted);margin-top:4px}

/* tabelas */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font:600 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t td.nw{white-space:nowrap}
.cel{display:flex;align-items:center;gap:8px}
.barra{position:relative;height:8px;border-radius:4px;background:var(--ne-bg);flex:1;min-width:50px}
.barra i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--deep)}
.barra i.f{background:var(--cr)}
.cel span{font:600 14px var(--cond);min-width:44px;text-align:right}
td small{display:block;color:var(--muted);font-size:12px}
.conf{margin-top:14px;padding:14px 18px;background:var(--soft);border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--ink2)}
.conf b{color:var(--ink)} .conf ul{margin:8px 0 0;padding-left:20px} .conf li{margin:4px 0}

/* grade local (dia × turno × equipamento) */
table.grade{border-collapse:separate;border-spacing:2px;font-size:11px}
table.grade th{font:600 10.5px var(--sans);color:var(--muted);padding:0 2px;text-align:center}
table.grade th.l{text-align:left;padding-right:8px;white-space:nowrap;font-size:12px;color:var(--ink2)}
table.grade td{width:24px;height:24px;text-align:center;border-radius:4px;font:700 12px var(--sans)}
td.fa{min-width:150px}
td.g-feito{background:var(--deep);color:#fff} td.g-nao{background:var(--cr-bg);color:var(--cr)} td.g-parada{background:var(--ne-bg);color:var(--muted)}

/* fontes */
table.f{width:100%;border-collapse:collapse;font-size:13.5px}
table.f th{font:600 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
table.f td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.limites{margin:14px 0 0;padding:14px 18px;background:var(--soft);border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--ink2)}
.limites b{color:var(--ink)} .limites ul{margin:8px 0 0;padding-left:20px} .limites li{margin:4px 0}
footer{margin-top:30px;color:var(--muted);font-size:12.5px;max-width:90ch}

@media (max-width:620px){
  main{padding:18px 14px 44px} h1{font-size:27px} .duas{grid-template-columns:1fr} .decidir{grid-template-columns:1fr}
  .chrome-top{padding:12px 14px 10px} .selo{display:none} .painel{padding:14px 12px}
  /* tabela por máquina vira cartão empilhado: as colunas que decidem (% da meta, falta) não ficam atrás de rolagem */
  table.maq,table.maq tbody,table.maq tr,table.maq td{display:block}
  table.maq thead{display:none}
  table.maq tr{padding:10px 0;border-bottom:1px solid var(--line)}
  table.maq td{border:0;padding:3px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;white-space:normal}
  table.maq td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left;flex:none}
  table.maq td:first-child{font-size:15px;justify-content:flex-start}
  table.maq td:first-child::before{content:none}
  table.maq td.vz{display:none}
  table.maq td.fa{min-width:0} table.maq td.fa .cel{width:60%}
  table.maq td small{text-align:right}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
</style>
</head>
<body>
<header class="chrome">
  <div class="chrome-top">
    <div class="marca"><b>Portal Trefila&nbsp;2</b><span>Cosigua &middot; Produção</span></div>
    <div class="selo"><b>Dados</b><span id="selo"></span></div>
  </div>

<main>

  <footer id="como-ler"></footer>
</main>

/* ---------- tooltip e gráfico de colunas (reuso nas três abas) ---------- */
const tip = $("tip"), BIND = [];
function mostraTip(ev, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, x = Math.min(innerWidth - w - 10, ev.clientX + 14);
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = (ev.clientY + 14) + "px";
}
const someTip = () => { tip.style.display = "none"; };
function nice(max, n = 5) {
  if (!(max > 0)) max = 1;
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const s = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  return {passo: s, topo: Math.ceil(max / s - 1e-9) * s};
}
let SEQ = 0;
/* itens: [{rot, v|null, cor, marca, rotulo, parado, tip}] — um número só aparece se o item pedir (rotulo) */
function colunas(o) {
  const id = "col" + (++SEQ);
  const W = o.W || 600, H = o.H || 250, mL = o.mL ?? 46, mR = o.mR ?? 14, mT = 22, mB = 32, iw = W - mL - mR, ih = H - mT - mB;
  const n = o.itens.length, sx = iw / n, bw = Math.min(30, sx * 0.64);
  const nz = o.topo ? {passo: o.passo || o.topo / 4, topo: o.topo} : nice(o.yMax, 4), topo = nz.topo;
  const X = (i) => mL + sx * (i + 0.5), Y = (v) => mT + ih * (1 - v / topo);
  let g = "";
  for (let v = 0; v <= topo + 1e-9; v += nz.passo) g += `<line x1="${mL}" x2="${W - mR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6ebf1"/><text x="${mL - 7}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#566677" class="num">${o.yFmt(v)}</text>`;
  (o.linhas || []).forEach(l => { g += `<line x1="${mL}" x2="${W - mR}" y1="${Y(l.v)}" y2="${Y(l.v)}" stroke="${l.cor || "#16202b"}" stroke-width="1.3" stroke-dasharray="${l.trac ? "5 4" : ""}" opacity=".75"/><text x="${W - mR}" y="${Y(l.v) - 5}" text-anchor="end" font-size="10.5" font-weight="600" fill="${l.cor || "#3d4c5a"}" class="hal">${E(l.rot)}</text>`; });
  const passoX = o.passoX || 1, y0 = Y(0);
  o.itens.forEach((it, i) => {
    const x = X(i);
    if (it.v == null) g += `<text x="${x}" y="${y0 - 6}" text-anchor="middle" font-size="14" fill="#7d8b9a">–</text>`;
    else if (it.parado) g += `<text x="${x}" y="${y0 - 5}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--cr)">✕</text>`;
    else g += `<rect x="${x - bw / 2}" y="${Y(it.v)}" width="${bw}" height="${Math.max(1.5, y0 - Y(it.v))}" rx="2" fill="${it.cor || "var(--deep)"}"/>`;
    if (it.marca != null) g += `<line x1="${x - bw / 2 - 3}" x2="${x + bw / 2 + 3}" y1="${Y(it.marca)}" y2="${Y(it.marca)}" stroke="#141b22" stroke-width="2"/>`;
    if (it.rotulo != null && it.v != null && !it.parado) g += `<text x="${x}" y="${Y(it.v) - 5}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141b22" class="num hal">${it.rotulo}</text>`;
    if (i % passoX === 0 || i === n - 1) g += `<text x="${x}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#566677" class="num">${E(it.rot)}</text>`;
  });
  g += `<g id="${id}h"></g><rect id="${id}c" x="${mL}" y="${mT}" width="${iw}" height="${ih}" fill="transparent"/>`;
  BIND.push(() => {
    const cap = $(id + "c"), hov = $(id + "h"), svg = cap.ownerSVGElement;
    cap.addEventListener("mousemove", (ev) => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(n - 1, Math.floor((px - mL) / sx)));
      hov.innerHTML = `<rect x="${mL + sx * i}" y="${mT}" width="${sx}" height="${ih}" fill="#16202b" opacity=".07"/>`;
      mostraTip(ev, o.itens[i].tip || "");
    });
    cap.addEventListener("mouseleave", () => { hov.innerHTML = ""; someTip(); });
  });
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="${E(o.aria)}">${g}</svg>`;
}
const legenda = (xs) => `<div class="leg">${xs.join("")}</div>`;

/* ======================================================================= ENTREGA */
function projecao(a) { return a.projecao; }
function cartaoArea(a) {
  const k = estEntrega(a.aderencia), det = (D.entrega_det && D.entrega_det.areas || {})[a.chave];
  const pj = a.meta_mes ? a.projecao / a.meta_mes : null;
  let rod = "";
  if (det) {
    const partes = [`${det.dias_com_meta} dias fechados com meta`, `${det.no_alvo.length} no alvo`, `${det.abaixo.length} abaixo de 90%`];
    partes.push(det.parados.length ? `<b>${det.parados.length} sem produção (${lista(det.parados.map(d => dd(d, fech)))})</b>` : "nenhum sem produção");
    rod = partes.join(" · ");
  }
  return `<article class="dec"><div class="topo"><span class="pilar">${E(a.nome)}</span>${chip(k)}</div>
    <div class="kv"><div class="v num">${P(a.aderencia)}</div><div class="l">da meta acumulada até ${dm(fech)}</div></div>
    <p class="num">Realizado ${T(a.real_acum)} de ${T(a.meta_acum)} previstos. Mantido esse ritmo, o mês fecha em <b>${T(a.projecao)}</b> — ${P(pj, 0)} da meta de ${T(a.meta_mes)}. Para chegar a 100% é preciso produzir <b>${P(a.aderencia_necessaria, 0)}</b> da programação diária nos ${a.dias_restantes} dias com meta que restam.</p>
    ${rod ? `<div class="rod">${rod}</div>` : ""}</article>`;
}
function graficoAcum(a, idx) {
  const W = 600, H = 300, mL = 52, mR = 96, mT = 16, mB = 30, iw = W - mL - mR, ih = H - mT - mB;
  const dias = a.dias, n = dias.length, dFech = Number(fech.slice(8, 10));
  const proj = dias.map((x) => (x.d <= dFech) ? x.acm_real : a.real_acum + (x.acm_meta - dias[dFech - 1].acm_meta) * (a.aderencia || 0));
  const nz = nice(Math.max(a.meta_mes, ...proj) / 1000), topo = nz.topo * 1000, passo = nz.passo * 1000;
  const X = (d) => mL + iw * ((d - 1) / (n - 1)), Y = (v) => mT + ih * (1 - v / topo);
  let g = "";
  for (let v = 0; v <= topo + 1; v += passo) g += `<line x1="${mL}" x2="${W - mR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6ebf1"/><text x="${mL - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#566677" class="num">${NF(v / 1000)}</text>`;
  g += `<text x="${mL - 8}" y="${mT - 6}" text-anchor="end" font-size="10.5" fill="#566677">t</text>`;
  [1, 8, 15, 22, 29].filter(d => d <= n).forEach(d => g += `<text x="${X(d)}" y="${H - 9}" text-anchor="middle" font-size="11" fill="#566677">${dd(d, fech)}</text>`);
  const pts = (fn, de, ate) => dias.filter(x => x.d >= de && x.d <= ate).map(x => `${X(x.d).toFixed(1)},${Y(fn(x)).toFixed(1)}`).join(" ");
  const gapKg = a.real_acum - dias[dFech - 1].acm_meta, yR = Y(a.real_acum), yM = Y(dias[dFech - 1].acm_meta), xF = X(dFech);
  g += `<polyline points="${pts(x => x.acm_meta, 1, n)}" fill="none" stroke="var(--plan)" stroke-width="2"/>`;
  g += `<polyline points="${pts(x => proj[x.d - 1], dFech, n)}" fill="none" stroke="var(--deep)" stroke-width="2.2" stroke-dasharray="6 5"/>`;
  g += `<polyline points="${pts(x => x.acm_real, 1, dFech)}" fill="none" stroke="var(--deep)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<line x1="${xF}" x2="${xF}" y1="${Math.min(yR, yM)}" y2="${Math.max(yR, yM)}" stroke="var(--cr)" stroke-width="2"/>`;
  g += `<circle cx="${xF}" cy="${yR}" r="4.6" fill="var(--deep)" stroke="#fff" stroke-width="2"/>`;
  g += `<text x="${xF + 6}" y="${Math.min(yR, yM) - 12}" font-size="12" font-weight="600" fill="var(--cr)" class="num hal">${gapKg >= 0 ? "+" : "−"}${NF(Math.abs(gapKg) / 1000, 1)} t vs. meta em ${dm(fech)}</text>`;
  const yMeta = Y(a.meta_mes), yProj = Y(proj[n - 1]), sep = Math.abs(yMeta - yProj) < 15 ? 15 : 0;
  g += `<text x="${W - mR + 8}" y="${Math.min(yMeta, yProj) + 4}" font-size="12" fill="var(--ink2)" font-weight="600" class="num">${yMeta <= yProj ? "Meta " + T(a.meta_mes) : "Proj. " + T(proj[n - 1])}</text>`;
  g += `<text x="${W - mR + 8}" y="${Math.max(yMeta, yProj) + 4 + sep / 2}" font-size="12" fill="${yMeta <= yProj ? "var(--deep)" : "var(--ink2)"}" font-weight="600" class="num">${yMeta <= yProj ? "Proj. " + T(proj[n - 1]) : "Meta " + T(a.meta_mes)}</text>`;
  g += `<g id="ah${idx}"></g><rect id="ac${idx}" x="${mL}" y="${mT}" width="${iw}" height="${ih}" fill="transparent"/>`;
  BIND.push(() => {
    const cap = $("ac" + idx), hov = $("ah" + idx), svg = cap.ownerSVGElement;
    cap.addEventListener("mousemove", (ev) => {

      const d = Math.max(1, Math.min(n, Math.round(1 + (px - mL) / iw * (n - 1)))), x = dias[d - 1];

function tabelaMaquinas(det) {

    h += `<div class="conf"><b>Conferência com o total da planilha.</b> Total: <span class="num">${T(conf.total_real, 1)} de ${T(conf.total_orc, 1)}</span> · soma das máquinas: <span class="num">${T(conf.soma_real, 1)} de ${T(conf.soma_orc, 1)}</span>.${li.length ? "<ul>" + li.map(x => `<li>${x}</li>`).join("") + "</ul>" : ""}</div>`;

    const turno = q.por_turno ? Object.fromEntries(Object.entries(q.por_turno).map(([k, v]) => [NT[k] || k, v])) : null;
    h += sec("Por equipamento, turno e turma (só local)", "Detalhe que não vai ao portal público (decisão de 30/09/2026).",
      `<div class="tres">${bloco("Por equipamento", q.por_maquina, "Equipamento")}${bloco("Por turno", turno, "Turno")}${bloco("Por turma", q.por_turma && Object.fromEntries(Object.entries(q.por_turma).map(([k, v]) => ["Turma " + k, v])), "Turma")}</div>`);
    if (q.grade && q.grade.length) {
      const ds = [...new Set(q.grade.map(c => c.d))].sort((a, b) => a - b);
      const linhas = [...new Set(q.grade.map(c => c.maq + "|" + c.turno))];
      const ordTurno = {manha: 0, tarde: 1, noite: 2};
      linhas.sort((a, b) => a.split("|")[0].localeCompare(b.split("|")[0], "pt", {numeric: true}) || ordTurno[a.split("|")[1]] - ordTurno[b.split("|")[1]]);
      const cel = (m, tn, d) => { const c = q.grade.find(x => x.maq === m && x.turno === tn && x.d === d); if (!c) return "<td></td>";
        return `<td class="g-${c.e}" title="${dd(d, fech)} · ${E(m)} · ${NT[tn] || tn} · turma ${E(c.turma)} · ${c.e === "feito" ? "feito" : c.e === "nao" ? "NÃO feito" : "sem produção"}">${c.e === "feito" ? "✓" : c.e === "nao" ? "✕" : "·"}</td>`; };
      h += sec("Grade do mês (só local)", "Cada célula é um equipamento em um turno de um dia: ✓ feita, ✕ não feita, · sem produção (não é exigida). Passe o mouse para ver a turma.",
        `<section class="painel" style="overflow-x:auto"><table class="grade"><thead><tr><th></th>${ds.map(d => `<th>${String(d).padStart(2, "0")}</th>`).join("")}</tr></thead><tbody>${
          linhas.map(l => { const [m, tn] = l.split("|"); return `<tr><th class="l">${E(m)} · ${NT[tn] || tn}</th>${ds.map(d => cel(m, tn, d)).join("")}</tr>`; }).join("")}</tbody></table></section>`);
    }
  }
  return h;
}

/* ======================================================================= FONTES E LIMITES */
function fontesELimites() {
  const linha = (nome, ref, quando, estado, k) => `<tr><td><b>${nome}</b><br><span style="color:var(--muted);font-size:12.5px">${ref}</span></td><td>${quando}</td><td>${chip(k, estado)}</td></tr>`;
  const r = [], lim = [];
  const falhou = (k, nome) => { if (D[k] && D[k].erro) r.push(linha(nome, "—", "—", "Sem dado nesta geração", "cr")); };
  if (PAG === "entrega") {
    if (ok(D.entrega)) r.push(linha("Produção × meta", "Planilha de controle (SharePoint)", "fechamento de " + dm(fech), "Atual até o último dia lançado", "ok")); else falhou("entrega", "Produção × meta");
    if (ok(D.aop)) r.push(linha("AOP", "Power BI · atendimento à ordem", "até " + dm(D.aop.dia), "Atual", "ok")); else falhou("aop", "AOP");
    lim.push("<b>Projeção:</b> realizado até aqui mais a meta que falta × a aderência acumulada do mês. Se o resto do mês for melhor ou pior que a média, a projeção muda.");
    lim.push("<b>Dia sem produção:</b> real igual a zero num dia com meta. Dia sem meta (sem programação) não entra na conta de dias fechados.");
    lim.push("<b>Total × máquinas:</b> o total do Ovalado vem da linha de total da planilha (a mesma da mensagem de produção); a soma das máquinas pode diferir, e a diferença aparece na conferência.");
    lim.push("<b>Metas de OEE e disponibilidade</b> ainda não definidas: ficam na aba de perdas como “sem meta”.");
  } else if (PAG === "seguranca") {
    const s = D.seguranca;
    if (ok(s)) r.push(linha("Segurança proativa", "Solvace via Power BI", E(s.base_ate), s.base_ok ? "Atual" : "Defasada", s.base_ok ? "ok" : "cr")); else falhou("seguranca", "Segurança proativa");
    lim.push("<b>Meta:</b> " + (ok(s) ? `${s.metas.cond} registros por pessoa e por frente no mês (Condição, Atitude Segura e Recusa de Tarefa)` : "indisponível") + ". Pessoas, nomes e turmas não aparecem no portal.");
    lim.push("<b>Meses anteriores</b> usam a equipe de hoje; quem entrou ou saiu depois não é refeito para trás.");
    lim.push("<b>Ritmo:</b> compara a parcela da equipe que já bateu a meta com a parcela do mês que já passou. É uma régua de acompanhamento, não uma meta oficial da área.");
    if (ok(s) && !s.base_ok) lim.push("<b>Base defasada:</b> o Solvace não atualizou no prazo; os números abaixo podem estar atrás da realidade.");
  } else {
    if (ok(D.qualidade)) r.push(linha("Rotina de qualidade", "MES · análises por equipamento e turno", "até " + dm(D.qualidade.ate), "Atual", "ok")); else falhou("qualidade", "Rotina de qualidade");
    lim.push("<b>Regra:</b> em cada equipamento e turno com produção, metragem e enrolamento devem ser feitos. Equipamento parado no turno não é exigido.");
    lim.push("<b>Meta de aderência</b> ainda não definida: por isso o estado é “sem meta”, nem verde nem vermelho.");
    lim.push("<b>Limite do MES:</b> a medição “fora de faixa” do MES depende de digitação e não é usada aqui como falha de qualidade.");
  }
  if ((D.avisos || []).length) lim.push("<b>Fontes com falha na geração:</b> " + D.avisos.map(E).join("; "));
  $("fontes").innerHTML = `<thead><tr><th>Fonte</th><th>Dado de</th><th>Situação</th></tr></thead><tbody>${r.join("")}</tbody>`;
  $("limites").innerHTML = "<b>Limites conhecidos</b><ul>" + lim.map(x => "<li>" + x + "</li>").join("") + "</ul>";
  $("como-ler").innerHTML = "<b>Como ler os estados.</b> Entrega e AOP: No alvo ≥ 100%, Atenção de 90 a 99,9%, Fora do alvo abaixo de 90% (mesma régua das mensagens do WhatsApp). “Sem meta definida” não significa bom nem ruim. Página sem nome de pessoa, matrícula ou login.";
}

/* ---------- montagem ---------- */
$("sub").textContent = {
  entrega: "Fechamento de produção em " + dm(fech) + " · mês até " + dm(fech) + " · atualizado " + D.gerado_em,
  seguranca: "Registros proativos do mês · base de " + (ok(D.seguranca) ? D.seguranca.base_ate : "—") + " · atualizado " + D.gerado_em,
  qualidade: "Rotina de análise · mês até " + (ok(D.qualidade) ? dm(D.qualidade.ate) : "—") + " · atualizado " + D.gerado_em
}[PAG];
$("app").innerHTML = {entrega: renderEntrega, seguranca: renderSeguranca, qualidade: renderQualidade}[PAG]();
BIND.forEach(f => f());
fontesELimites();
</script>
